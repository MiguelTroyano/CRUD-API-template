<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">          <!--Fundamental para que el HTML se considere "seguro" cibernéticamente-->
    <title>Home</title>           <!--Texto que aparece en la pestaña del navegador-->

    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <!--PANTALLA LOGIN-->
    <div id="login-screen">
        <h1>Sign in</h1>
        <input id="login-username" placeholder="Username">
        <input id="login-password" placeholder="Password" type="password">
        <button onclick="login()">Log in</button>
        <button onclick="register()">Sign up</button>
        <p id="login-error" class="error"></p>
    </div>

    <!--PANTALLA PRINCIPAL APP-->
    <div id="app-screen" style="display: none;">                                      <!--Ponemos display none para que no se muestre de primeras-->
        <div class="top-bar">
            <h1>Basic manager</h1>
            <button onclick="logout()">Log out</button>
        </div>

        <div>
            <input id="new-item" placeholder="What's your new item called?">     <!--Añadir un id permite luego referenciar a este objeto al escribir en JS y recuperar así su contenido-->
            <button onclick="createItem()">Add</button>                             <!--Esta función se define posteriormente en el documento-->
        </div>

        <ul id="item-list"></ul>        <!--lista que es rellenada con la ejecución del script JS-->
    </div>
</body>
</html>
