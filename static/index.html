<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">          <!--Essential for the HTML to be considered "safe" security-wise-->
    <title>Home</title>           <!--Text shown in the browser tab-->

    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <!--LOGIN SCREEN-->
    <div id="login-screen">
        <h1>Sign in</h1>
        <input id="login-username" placeholder="Username">
        <input id="login-password" placeholder="Password" type="password">
        <button onclick="login()">Log in</button>
        <button onclick="register()">Sign up</button>
        <p id="login-error" class="error"></p>
    </div>

    <!--MAIN APP SCREEN-->
    <div id="app-screen" style="display: none;">                                      <!--We set display none so it isn't shown at first-->
        <div class="top-bar">
            <h1>Basic manager</h1>
            <button onclick="logout()">Log out</button>
        </div>

        <div>
            <input id="new-item" placeholder="What's your new item called?">     <!--Adding an id lets us reference this element later from JS and read its content-->
            <button onclick="createItem()">Add</button>                             <!--This function is defined later, in the JS file-->
        </div>

        <ul id="item-list"></ul>        <!--list that gets filled in when the JS script runs-->
    </div>
</body>
</html>
